name: Evernote Digest to LINE

on:
  workflow_dispatch:        # 手動実行ボタンを表示
  schedule:
    - cron: '28 21 * * *'   # 毎日JST 06:28（UTCはJST-9）

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 固定

      - name: Install deps
        run: pip install requests

      - name: Send LINE
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python main.py

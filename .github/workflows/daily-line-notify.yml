name: Evernote Digest to LINE

on:
  schedule:
    - cron: "28 21 * * *"  # JSTで朝6:28に実行（UTCだと21:28）
  workflow_dispatch:      # 手動実行も可能

jobs:
  send_line:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run LINE Notify script
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: python main.py
